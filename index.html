<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ハザマップv2">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css?v=v2-3">
<title>くまもとハザードマップ v2（開発中）</title>
</head>
<body>
<div id="map"></div>

<header class="topbar">
  <div class="topline">
    <div class="place"><span id="placeName">熊本県</span></div>
    <div class="topbtns">
      <button id="btnSearch" class="iconbtn" aria-label="住所・施設名で探す">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke-width="2.2"/><path d="M15.5 15.5L21 21" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <button id="btnHelp" class="iconbtn" aria-label="使い方">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke-width="2"/><path d="M9.3 9.2a2.8 2.8 0 1 1 3.9 2.6c-.8.4-1.2.9-1.2 1.8v.6" fill="none" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.2" stroke="none"/></svg>
      </button>
      <span id="netBadge" class="badge online">オンライン</span>
    </div>
  </div>
  <nav class="chips" id="layerChips" aria-label="表示する災害"></nav>
</header>

<div class="fabs">
  <button id="btnLegend" class="fab" aria-label="色の見かた">
    <span class="fab-txt">色の<br>見かた</span>
  </button>
  <button id="btnCards" class="fab" aria-label="わたしの避難カード">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5" fill="none" stroke-width="2"/><path d="M7 10h6M7 14h10" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button id="btnLocate" class="fab fab-primary" aria-label="現在地の危険を見る">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6"/><circle cx="12" cy="12" r="7.5" fill="none" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke-width="2" stroke-linecap="round"/></svg>
    <span>現在地</span>
  </button>
  <button id="btnDownload" class="fab" aria-label="電波がなくても見られるように保存">
    <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<div id="legend" class="legend" hidden></div>

<button id="dsToggle" class="dstoggle" hidden aria-expanded="false">深さで<br>絞り込む</button>
<div id="depthSlider" class="dslider" hidden aria-label="浸水の深さで絞り込む">
  <button class="ds-close" id="dsClose" aria-label="たたむ">×</button>
  <div class="ds-track" id="dsTrack"></div>
</div>
<div id="dsBanner" class="dsbanner" hidden></div>

<section id="search" class="searchbox" hidden>
  <div class="search-row">
    <input id="searchInput" type="search" placeholder="住所・学校・施設名（例：熊本市中央区）" autocomplete="off" enterkeyhint="search">
    <button id="searchClose" class="textbtn">閉じる</button>
  </div>
  <ul id="searchResults" class="results"></ul>
</section>

<section id="sheet" class="sheet" hidden aria-live="polite">
  <div class="grab" id="grab" role="button" aria-label="結果の大きさを切り替え"><i></i></div>
  <button class="sheet-close" id="sheetClose" aria-label="閉じる">×</button>
  <div id="sheetBody"></div>
</section>

<section id="dlPanel" class="panel" hidden>
  <div class="panel-head">
    <h2>電波がなくても見られるように</h2>
    <button id="dlClose" class="textbtn">完了</button>
  </div>
  <p class="panel-lead">地図とハザード情報を端末に保存します。Wi-Fiにつながっているときの保存がおすすめです。</p>
  <div class="storage" id="storageInfo">保存容量を確認中…</div>
  <h3 class="sec">県全体の概略地図</h3>
  <ul id="prefList" class="dllist"></ul>
  <h3 class="sec">保存した地点</h3>
  <ul id="placeList" class="dllist"></ul>
  <button id="addPlace" class="addbtn">＋ 地点を追加（自宅・学校など）</button>
  <details id="muniDetails" class="muni">
    <summary>市町村ごとに保存する</summary>
    <div class="seg" role="radiogroup" aria-label="保存の細かさ">
      <button data-q="15" class="on">標準<small>軽い・町名まで</small></button>
      <button data-q="16">詳細<small>道路まで鮮明・約3倍</small></button>
    </div>
    <input id="dlSearch" type="search" placeholder="市町村名で絞り込み" autocomplete="off">
    <ul id="dlList" class="dllist"></ul>
  </details>
  <p class="panel-note">iPhoneでは、Safariの共有ボタンから「ホーム画面に追加」して使うと、保存データが消えにくくなります。</p>
</section>

<section id="cardPanel" class="panel" hidden>
  <div class="panel-head">
    <h2>わたしの避難カード</h2>
    <button id="cardClose" class="textbtn">閉じる</button>
  </div>
  <div id="cardBody"></div>
</section>

<div id="onboard" class="modal" hidden>
  <div class="modal-card onboard">
    <div class="ob-steps" id="obSteps"></div>
    <div class="ob-dots" id="obDots"></div>
    <div class="ob-actions">
      <button id="obBack" class="textbtn">戻る</button>
      <button id="obNext" class="primary">次へ</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js?v=v2-3"></script>
</body>
</html>
